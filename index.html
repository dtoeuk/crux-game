    :root {
      --font-display: 'Chakra Petch', sans-serif;

    .font-display {

    }

    .wall-surface {

        radial-gradient(#141a29 1.5px, transparent 1.5px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
    }
